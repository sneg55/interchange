name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    name: offline fleet cycle and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The offline path takes exactly one dependency. If this line ever needs a
      # second, the claim that the system runs without cloud credentials is wrong.
      - run: python -m pip install jsonschema
      - name: verify the fixture snapshot is unmodified
        run: python scripts/capture_fixtures.py --verify
      - name: one full fleet cycle, offline
        run: python scripts/run_cycle.py
      - name: unit tests
        run: python -m unittest discover -s tests

  console:
    name: console tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
