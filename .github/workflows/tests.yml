name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Split by measured cost, not by theme. test_pipeline is ~1824s locally and
  # every other module together is under 200s, so one job per side keeps both
  # inside a sane budget instead of one job running past an hour.
  pipeline:
    name: pipeline tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install jsonschema
      - run: python -m unittest tests.test_pipeline

  offline:
    name: offline fleet cycle and the rest of the suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The offline path takes exactly one dependency. If this line ever needs a
      # second, the claim that the system runs without cloud credentials is wrong.
      - run: python -m pip install jsonschema
      - name: verify the fixture snapshot is unmodified
        run: python scripts/capture_fixtures.py --verify
      - name: one full fleet cycle, offline
        run: python scripts/run_cycle.py
      - name: every module except test_pipeline
        run: |
          mods=$(ls tests/test_*.py | sed 's|tests/||;s|\.py$||' \
            | grep -v '^test_pipeline$' | sed 's|^|tests.|' | tr '\n' ' ')
          echo "running: $mods"
          python -m unittest $mods

  console:
    name: console tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
